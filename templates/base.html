{% load static %}

<!DOCTYPE html>

<html>

<head>

<title>Rift Koders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
rel="stylesheet">

<style>

body{

    background:#0a0a0a;

    color:white;

    min-height:100vh;

    background-image:
    radial-gradient(
        circle at top right,
        rgba(255,20,147,.15),
        transparent 40%
    );

}

.navbar{

    background:#000 !important;

    border-bottom:1px solid #ff1493;

}

.logo{

    height:55px;

}

.text-pink{

    color:#ff1493;

}

.card{

    background:#111;

    border:1px solid #222;

    border-radius:20px;

    color:white;

}

.btn-primary{

    background:#ff1493;

    border:none;

}

.btn-primary:hover{

    background:#ff0080;

}

.footer{

    background:#000;

    padding:30px;

    text-align:center;

    margin-top:60px;

}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a class="navbar-brand" href="/">

<img
src="{% static 'images/rift_logo.png' %}"
class="logo">

</a>

<div>

<a href="/"
class="btn btn-dark me-2">

Home

</a>

<a href="/problems/"
class="btn btn-dark me-2">

Problems

</a>

<a href="/dashboard/"
class="btn btn-dark me-2">

Dashboard

</a>

<a href="/leaderboard/"
class="btn btn-dark me-2">

Leaderboard

</a>

{% if user.is_authenticated %}

<a href="/users/profile/"
class="btn btn-dark me-2">

Profile

</a>

<a href="/submit/history/"
class="btn btn-dark me-2">

History

</a>

<a href="/users/logout/"
class="btn btn-danger">

Logout

</a>

{% else %}

<a href="/users/login/"
class="btn btn-success me-2">

Login

</a>

<a href="/users/register/"
class="btn btn-primary">

Register

</a>

{% endif %}

</div>

</div>

</nav>

<div class="container mt-4">

{% block content %}
{% endblock %}

</div>

<footer class="footer">

<img
src="{% static 'images/rift_logo.png' %}"
height="70">

<h5 class="mt-3">

Rift Koders AI Coding Platform

</h5>

<p>

Learn • Practice • Compete • Grow

</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
