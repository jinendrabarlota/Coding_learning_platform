{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card p-4 shadow-lg">

<div class="text-center">

<h1 class="text-pink mb-4">
🔐 Login
</h1>

<p>
Welcome Back to Rift Koders
</p>

</div>

{% if error %}

<div class="alert alert-danger">

{{ error }}

</div>

{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Username

</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<button
type="submit"
class="btn btn-primary w-100">

Login

</button>

</form>

<div class="text-center mt-3">

Don't have an account?

<a href="/users/register/">

Register

</a>

</div>

</div>

</div>

</div>

{% endblock %}
