{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card p-4 shadow-lg">

<div class="text-center">

<h1 class="text-pink mb-4">
🚀 Register
</h1>

<p>
Create your Rift Koders account
</p>

</div>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">
Username
</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">
Email
</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">
Password
</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<button
type="submit"
class="btn btn-primary w-100">

Create Account

</button>

</form>

<div class="text-center mt-3">

Already have an account?

<a href="/users/login/">
Login
</a>

</div>

</div>

</div>

</div>

{% endblock %}
