{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="card p-4">

        <h2 class="text-pink">

            Submission Result

        </h2>

        <hr>

        <h3>

            Status:

            <span class="badge bg-success">

                {{ result.status }}

            </span>

        </h3>

        <h4>

            Score:

            {{ result.score }}

        </h4>

        <h5>

            Runtime:

            {{ result.runtime }}

        </h5>

        <h5>

            Memory:

            {{ result.memory }}

        </h5>

        <hr>

        <h3 class="text-pink">

            🤖 AI Code Review

        </h3>

        <ul>

            {% for item in ai_review %}

            <li>

                {{ item }}

            </li>

            {% endfor %}

        </ul>

        <a
            href="/problems/"
            class="btn btn-primary">

            Back to Problems

        </a>

    </div>

</div>

{% endblock %}
